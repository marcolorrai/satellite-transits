[Observer]
; Generic Rome coordinates; replace with your observing location.
latitude = 41.9028
longitude = 12.4964
elevation_m = 21

[Search]
max_distance_km = 25
; Empty means the current UTC date and time.
start_date =
; Set the last date to search, in UTC.
end_date = 2026-12-31
coarse_step_seconds = 5.0
fine_step_seconds = 1.0
min_altitude_deg = 10

[Targets]
transit_objects = Jupiter,Polaris

[Satellites]
tle_source = https://celestrak.org/NORAD/elements/gp.php?GROUP=stations&FORMAT=tle

[Output]
map_dir = transit_maps
tile_layer = esri_imagery
